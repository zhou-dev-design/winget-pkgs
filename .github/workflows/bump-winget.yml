# 只跟两个包的 winget 清单：Microsoft.VisualStudioCode（stable）和 DeepSeek.DeepSeekHarnessDesktop
# 每小时跑一次；有新版本就生成清单 → winget validate → 提交到 master → 顺手向上游开 PR
#
# 需要的 secret：GH_TOKEN —— classic PAT，勾 public_repo
#   （fine-grained 不行：GitHub 不允许 fine-grained token 向非成员公共仓库提交内容，
#     microsoft/winget-pkgs 正是这种；classic 的 public_repo 同时覆盖 fork 写分支 + 上游开 PR）
#   没配也能跑，只是不会开 PR，只更新自己 fork 的 master
#
# 手动触发：Actions → bump winget manifests → Run workflow
# 首次使用：fork 仓库的 Actions 默认是关的，需要在 Actions 页点一次 "I understand my workflows, go ahead and enable them"

name: bump winget manifests

on:
  schedule:
    - cron: '17 * * * *'        # UTC 每小时 17 分（整点排队最挤）
  workflow_dispatch:

permissions:
  contents: write               # 用 GITHUB_TOKEN 提交并推送

concurrency:
  group: bump-winget
  cancel-in-progress: false

jobs:
  bump:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: 检出（只取两个包的目录，不拉整个仓库）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            manifests/m/Microsoft/VisualStudioCode
            manifests/d/DeepSeek/DeepSeekHarnessDesktop
            .github/scripts

      - name: 探测新版本、生成清单并开 PR
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name  "zhoubo"
          git config user.email "118490829+zhou-dev-design@users.noreply.github.com"
          # 不能写成 @argv：数组 splat 不会把 '-OpenPr' 当开关，会当成位置参数塞给 $RepoRoot
          if ($env:GH_TOKEN) {
            Write-Host "GH_TOKEN 已配置（长度 $($env:GH_TOKEN.Length)），本轮会向上游开 PR"
            ./.github/scripts/bump-winget.ps1 -OpenPr
          } else {
            Write-Host '::warning title=GH_TOKEN 未配置::只更新自己 fork 的 master，不会向上游开 PR。Settings → Secrets and variables → Actions 加一个名为 GH_TOKEN 的 classic PAT（勾 public_repo）'
            ./.github/scripts/bump-winget.ps1
          }
          if ($LASTEXITCODE -ne 0) { throw "bump 脚本退出码 $LASTEXITCODE" }

      - name: 推送到 master
        shell: pwsh
        run: |
          git log --oneline -3
          git push
