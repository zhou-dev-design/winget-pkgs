name: tmp-disable-extra-workflows

# 临时工作流：把 fork 里从上游带过来的工作流逐个停用（保留 bump-winget.yml）。
# 用仓库自带的 GITHUB_TOKEN（permissions: actions: write）调 Actions 接口，不需要额外 PAT。
# 结果写到 .github/ci-report/disable-workflows.txt，跑完即可删除本文件。

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tmp-disable-extra-workflows.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  disable:
    runs-on: ubuntu-latest
    steps:
      - name: 逐个停用
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/$REPO"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")

          # 保留：自己 + 我们的跟版本工作流
          keep="bump-winget.yml tmp-disable-extra-workflows.yml"

          targets="domain-validation-assist.lock.yml elevation-requirement-review.lock.yml label-reconciliation-assist.lock.yml manifest-metadata-review.lock.yml manifest-validation-diagnosis.lock.yml missing-dependency-assist.lock.yml pesterTests.yaml scriptAnalyzer.yaml spellCheck.yaml transient-security-explanation.lock.yml unattended-artifact-triage.lock.yml wingetbot-pr-triage.lock.yml"

          : > /tmp/res.txt
          for n in $targets; do
            case " $keep " in
              *" $n "*) echo "keep     $n" | tee -a /tmp/res.txt; continue ;;
            esac
            code=$(curl -sS -o /tmp/body.txt -w '%{http_code}' -X PUT "${hdr[@]}" \
                     "$api/actions/workflows/$n/disable")
            printf '%s\t%s\n' "$code" "$n" | tee -a /tmp/res.txt
            if [ "$code" != "204" ]; then cat /tmp/body.txt; echo; fi
          done

          echo "---- 停用后的实际状态 ----"
          curl -sS "${hdr[@]}" "$api/actions/workflows?per_page=100" -o /tmp/wf.json
          jq -r '.workflows[] | "\(.state)\t\(.path)"' /tmp/wf.json | tee -a /tmp/res.txt

          {
            echo "repo: $REPO"
            echo "run: $RUN_ID"
            echo "date: $(date -u +%FT%TZ)"
            echo "==== disable 返回码 ===="
            sed -n '1,20p' /tmp/res.txt
          } > /tmp/report.txt

          # 用 contents API 写报告：只动这一个文件，不会影响仓库其余 78 万个文件
          body=$(jq -n --arg m "ci: record workflow-disable result ($RUN_ID)" \
                       --arg c "$(base64 -w0 < /tmp/report.txt)" \
                       '{message:$m, content:$c, branch:"master"}')
          code=$(curl -sS -o /tmp/put.txt -w '%{http_code}' -X PUT "${hdr[@]}" \
                   -H "Content-Type: application/json" \
                   "$api/contents/.github/ci-report/disable-workflows.txt" -d "$body")
          echo "report PUT -> $code"
          [ "$code" = "201" ] || [ "$code" = "200" ] || cat /tmp/put.txt
